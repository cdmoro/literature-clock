name: Catalogue tests
on: [pull_request]
jobs:
  catalogues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/generate_times.py
