name: macOS app

on:
  pull_request:
    branches: [main]
    paths:
      - 'apple/**'
      - '.github/workflows/macos-app.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate app component version
        run: python3 scripts/validate_release_versions.py --pull-request
      - name: Build and verify universal ad-hoc signed DMG
        run: python3 apple/build.py
      - name: Verify app bundle metadata and embedded widget
        run: |
          APP="$GITHUB_WORKSPACE/apple/build/dmg/Literature Clock.app"
          test -d "$APP"
          python3 - "$APP" <<'PYTHON'
          import plistlib
          import re
          import sys
          from pathlib import Path

          app = Path(sys.argv[1])
          config = Path('apple/Version.xcconfig').read_text()
          expected_version = re.search(r'^MARKETING_VERSION\s*=\s*(\S+)', config, re.M).group(1)
          expected_build = re.search(r'^CURRENT_PROJECT_VERSION\s*=\s*(\S+)', config, re.M).group(1)
          extensions = list((app / 'Contents/PlugIns').glob('*.appex'))
          if len(extensions) != 1:
              raise SystemExit(f'Expected one embedded widget extension, found {len(extensions)}')
          for bundle in [app, *extensions]:
              info_path = bundle / 'Contents/Info.plist'
              info = plistlib.loads(info_path.read_bytes())
              actual = (info['CFBundleShortVersionString'], info['CFBundleVersion'])
              expected = (expected_version, expected_build)
              if actual != expected:
                  raise SystemExit(f'{bundle.name}: version {actual} does not match {expected}')
              if info.get('ClockAppGroup') != 'JTNBVS8ZJ3.net.literatureclock.app':
                  raise SystemExit(f'{bundle.name}: unexpected app group {info.get("ClockAppGroup")!r}')
              print(f'{bundle.name}: version {actual[0]} ({actual[1]}), app group verified')
          PYTHON
          for BINARY in "$APP/Contents/MacOS/LiteratureClockMac" "$APP/Contents/PlugIns/LiteratureClockMacWidgetExtension.appex/Contents/MacOS/LiteratureClockMacWidgetExtension"; do
            ARCHS="$(lipo -archs "$BINARY")"
            [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]] || { echo "Missing universal architectures: $ARCHS"; exit 1; }
            echo "$BINARY: $ARCHS"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Literature-Clock-macOS-App
          path: |
            apple/build/Literature-Clock-App-macOS.dmg
            apple/build/Literature-Clock-App-macOS.dmg.sha256
          if-no-files-found: error
          retention-days: 14
