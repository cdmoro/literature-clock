name: Windows native screensaver
on:
  pull_request:
    branches: [main]
    paths:
      - 'screensavers/windows-native/**'
      - 'screensavers/macos-native/Assets/**'
      - 'screensavers/macos-native/build.py'
      - 'quotes/**'
      - 'src/strings/**'
      - 'src/photo-providers.json'
      - 'public/assets/**'
      - '.github/workflows/windows-native-screensaver.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install Pillow==11.3.0
      - name: Build standalone native screensaver
        shell: pwsh
        run: ./screensavers/windows-native/build.ps1 -Runtime '${{ matrix.runtime }}'
      - uses: actions/upload-artifact@v4
        with:
          name: Literature-Clock-Native-Windows-${{ matrix.runtime }}
          path: |
            screensavers/windows-native/build/Literature-Clock-Native-Windows-${{ matrix.runtime }}.scr
            screensavers/windows-native/build/Literature-Clock-Native-Windows-${{ matrix.runtime }}.scr.sha256
          if-no-files-found: error
