name: Literature Clock release

on:
  pull_request:
    branches: [main]
    paths:
      - 'release/VERSION'
      - '.github/workflows/release.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'public/**'
      - 'quotes/**'
      - 'times/**'
      - 'screensavers/macos-native/**'
      - 'screensavers/windows-native/**'
  push:
    branches: [main]
    paths:
      - 'release/VERSION'

permissions:
  contents: read

jobs:
  validate-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check component versions against the previous consolidated release
        if: github.event_name == 'push'
        run: python3 scripts/validate_release_versions.py
      - name: Check component versions for pull requests
        if: github.event_name == 'pull_request'
        run: python3 scripts/validate_release_versions.py --pull-request

  macos:
    needs: validate-versions
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure the Metal compiler is available
        run: |
          if ! xcrun metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun metal --version
          fi
      - name: Build universal native saver
        run: python3 screensavers/macos-native/build.py --universal
      - name: Check installer transactions
        run: '"screensavers/macos-native/build/Install Literature Clock.app/Contents/MacOS/Install Literature Clock" --check-install'
      - uses: actions/upload-artifact@v4
        with:
          name: Literature-Clock-macOS
          path: |
            screensavers/macos-native/build/Literature-Clock-Native-macOS.saver.zip
            screensavers/macos-native/build/Literature-Clock-Native-macOS.saver.zip.sha256

  windows:
    needs: validate-versions
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install Pillow==11.3.0
      - name: Build standalone native screensaver
        shell: pwsh
        run: ./screensavers/windows-native/build.ps1 -Runtime '${{ matrix.runtime }}'
      - uses: actions/upload-artifact@v4
        with:
          name: Literature-Clock-Windows-${{ matrix.runtime }}
          path: |
            screensavers/windows-native/build/Literature-Clock-Native-Windows-${{ matrix.runtime }}.scr
            screensavers/windows-native/build/Literature-Clock-Native-Windows-${{ matrix.runtime }}.scr.sha256

  publish:
    if: github.event_name == 'push'
    needs: [validate-versions, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: Literature-Clock-*
          path: package
          merge-multiple: true
      - name: Create the consolidated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          import subprocess
          import textwrap
          from pathlib import Path
          version = Path('release/VERSION').read_text().strip()
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Invalid release/VERSION; expected major.minor.patch')
          macos = Path('screensavers/macos-native/VERSION').read_text().strip()
          windows = Path('screensavers/windows-native/VERSION').read_text().strip()
          files = sorted(Path('package').glob('*'))
          expected = {
              'Literature-Clock-Native-macOS.saver.zip',
              'Literature-Clock-Native-macOS.saver.zip.sha256',
              'Literature-Clock-Native-Windows-win-x64.scr',
              'Literature-Clock-Native-Windows-win-x64.scr.sha256',
              'Literature-Clock-Native-Windows-win-arm64.scr',
              'Literature-Clock-Native-Windows-win-arm64.scr.sha256',
          }
          if {file.name for file in files} != expected:
              raise SystemExit('Release artifact set is incomplete or contains unexpected files')
          tag = 'literature-clock-v' + version
          version_tuple = tuple(map(int, version.split('.')))
          mother_tags = []
          for candidate in subprocess.run(['git', 'tag', '--list', 'literature-clock-v*'], check=True, capture_output=True, text=True).stdout.splitlines():
              match = re.fullmatch(r'literature-clock-v(\d+)\.(\d+)\.(\d+)', candidate)
              if match:
                  candidate_version = tuple(map(int, match.groups()))
                  if candidate_version < version_tuple:
                      mother_tags.append((candidate_version, candidate))
          if mother_tags:
              previous_tag = max(mother_tags)[1]
          else:
              web_tags = []
              for candidate in subprocess.run(['git', 'tag', '--list', 'v[0-9]*'], check=True, capture_output=True, text=True).stdout.splitlines():
                  match = re.fullmatch(r'v(\d+)\.(\d+)\.(\d+)', candidate)
                  if match:
                      web_tags.append((tuple(map(int, match.groups())), candidate))
              previous_tag = max(web_tags)[1] if web_tags else ''
          notes = textwrap.dedent(f'''\
          ## Component versions

          - Web: hosted at https://literatureclock.netlify.app/
          - macOS screensaver: {macos}
          - Windows screensaver: {windows}

          This consolidated release includes the native macOS and Windows downloads for this project release. The web app is hosted at https://literatureclock.netlify.app/.
          ''')
          command = ['gh', 'release', 'create', tag, *map(str, files), '--target', os.environ['GITHUB_SHA'], '--title', 'Literature Clock ' + version, '--notes', notes, '--generate-notes', '--latest']
          if previous_tag:
              command.extend(['--notes-start-tag', previous_tag])
          subprocess.run(command, check=True)
          PYTHON

  deploy-web:
    if: github.event_name == 'push'
    needs: [validate-versions, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Netlify production deploy
        env:
          NETLIFY_DEPLOY_HOOK: ${{ secrets.NETLIFY_PRODUCTION_DEPLOY_HOOK }}
        run: |
          if [ -n "$NETLIFY_DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error --request POST "$NETLIFY_DEPLOY_HOOK"
          else
            echo "Netlify deploy hook is not configured; skipping web deploy."
          fi
