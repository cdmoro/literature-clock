name: Literature Clock release

on:
  pull_request:
    branches: [main]
    paths:
      - 'release/VERSION'
      - '.github/workflows/release.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'public/**'
      - 'quotes/**'
      - 'times/**'
      - 'scripts/validate_release_versions.py'
      - 'scripts/component_ownership.py'
      - 'scripts/label_pr_impacts.py'
      - 'scripts/test_component_ownership.py'
      - '.github/workflows/label-merged-pr.yml'
      - 'screensavers/macos-native/**'
      - 'screensavers/windows-native/**'
  push:
    branches: [main]
    paths:
      - 'release/VERSION'

permissions:
  contents: read

jobs:
  validate-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test release component mapping
        run: python3 -m unittest discover -s scripts -p 'test_component_ownership.py'
      - name: Check component versions against the previous consolidated release
        if: github.event_name == 'push'
        run: python3 scripts/validate_release_versions.py
      - name: Check component versions for pull requests
        if: github.event_name == 'pull_request'
        run: python3 scripts/validate_release_versions.py --pull-request

  macos:
    needs: validate-versions
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure the Metal compiler is available
        run: |
          if ! xcrun metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun metal --version
          fi
      - name: Build universal native saver
        run: python3 screensavers/macos-native/build.py --universal
      - name: Check installer transactions
        run: '"screensavers/macos-native/build/Install Literature Clock.app/Contents/MacOS/Install Literature Clock" --check-install'
      - uses: actions/upload-artifact@v4
        with:
          name: Literature-Clock-macOS
          path: |
            screensavers/macos-native/build/Literature-Clock-Native-macOS.saver.zip
            screensavers/macos-native/build/Literature-Clock-Native-macOS.saver.zip.sha256

  windows:
    needs: validate-versions
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install Pillow==11.3.0
      - name: Build standalone native screensaver
        shell: pwsh
        run: ./screensavers/windows-native/build.ps1 -Runtime '${{ matrix.runtime }}'
      - uses: actions/upload-artifact@v4
        with:
          name: Literature-Clock-Windows-${{ matrix.runtime }}
          path: |
            screensavers/windows-native/build/Literature-Clock-Native-Windows-${{ matrix.runtime }}.scr
            screensavers/windows-native/build/Literature-Clock-Native-Windows-${{ matrix.runtime }}.scr.sha256

  publish:
    if: github.event_name == 'push'
    needs: [validate-versions, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: Literature-Clock-*
          path: package
          merge-multiple: true
      - name: Create the consolidated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          import subprocess
          import textwrap
          from pathlib import Path
          version = Path('release/VERSION').read_text().strip()
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Invalid release/VERSION; expected major.minor.patch')
          macos = Path('screensavers/macos-native/VERSION').read_text().strip()
          windows = Path('screensavers/windows-native/VERSION').read_text().strip()
          web = json.loads(Path('package.json').read_text())['version']
          files = sorted(Path('package').glob('*'))
          expected = {
              'Literature-Clock-Native-macOS.saver.zip',
              'Literature-Clock-Native-macOS.saver.zip.sha256',
              'Literature-Clock-Native-Windows-win-x64.scr',
              'Literature-Clock-Native-Windows-win-x64.scr.sha256',
              'Literature-Clock-Native-Windows-win-arm64.scr',
              'Literature-Clock-Native-Windows-win-arm64.scr.sha256',
          }
          if {file.name for file in files} != expected:
              raise SystemExit('Release artifact set is incomplete or contains unexpected files')
          tag = 'literature-clock-v' + version
          version_tuple = tuple(map(int, version.split('.')))
          mother_tags = []
          for candidate in subprocess.run(['git', 'tag', '--list', 'literature-clock-v*'], check=True, capture_output=True, text=True).stdout.splitlines():
              match = re.fullmatch(r'literature-clock-v(\d+)\.(\d+)\.(\d+)', candidate)
              if match:
                  candidate_version = tuple(map(int, match.groups()))
                  if candidate_version < version_tuple:
                      mother_tags.append((candidate_version, candidate))
          if mother_tags:
              previous_tag = max(mother_tags)[1]
          else:
              web_tags = []
              for candidate in subprocess.run(['git', 'tag', '--list', 'v[0-9]*'], check=True, capture_output=True, text=True).stdout.splitlines():
                  match = re.fullmatch(r'v(\d+)\.(\d+)\.(\d+)', candidate)
                  if match:
                      web_tags.append((tuple(map(int, match.groups())), candidate))
              previous_tag = max(web_tags)[1] if web_tags else ''
          def component_changed(path, current):
              if not previous_tag:
                  return True
              try:
                  previous = subprocess.run(['git', 'show', f'{previous_tag}:{path}'], check=True,
                                            capture_output=True, text=True).stdout.strip()
              except subprocess.CalledProcessError:
                  return True
              if path == 'package.json':
                  previous = json.loads(previous)['version']
              return previous != current
          macos_updated = component_changed('screensavers/macos-native/VERSION', macos)
          windows_updated = component_changed('screensavers/windows-native/VERSION', windows)
          web_updated = component_changed('package.json', web)
          def marker(updated):
              return ' **🆕 updated**' if updated else ''
          notes = textwrap.dedent(f'''\
          ## Component versions

          - <img src="https://cdn.simpleicons.org/apple/ffffff" alt="Apple" width="20" /> macOS screensaver: {macos}{marker(macos_updated)}
          - <img src="https://raw.githubusercontent.com/cdmoro/literature-clock/main/docs/windows.svg" alt="Windows" width="20" /> Windows screensaver: {windows}{marker(windows_updated)}
          - 🌎 Web app: {web}{marker(web_updated)}

          This consolidated release includes the native macOS and Windows downloads for this project release. The web app is hosted at https://literatureclock.netlify.app/.
          ''')
          repository = os.environ['GITHUB_REPOSITORY']
          generated_command = ['gh', 'api', f'repos/{repository}/releases/generate-notes', '-f', f'tag_name={tag}', '-f', f'target_commitish={os.environ["GITHUB_SHA"]}']
          if previous_tag:
              generated_command.extend(['-f', f'previous_tag_name={previous_tag}'])
          generated = json.loads(subprocess.run(generated_command, check=True, capture_output=True, text=True).stdout)['body']
          impact_names = {'affects:web': 'Web', 'affects:macos-screensaver': 'macOS screensaver', 'affects:windows-screensaver': 'Windows screensaver'}
          decorated = []
          for line in generated.splitlines():
              match = re.search(r'#(\d+)', line)
              if match:
                  labels = json.loads(subprocess.run(['gh', 'api', f'repos/{repository}/issues/{match.group(1)}/labels'], check=True, capture_output=True, text=True).stdout)
                  impacts = [impact_names[label['name']] for label in labels if label['name'] in impact_names]
                  if impacts:
                      line += ' — **Affected artifacts:** ' + ', '.join(impacts)
              decorated.append(line)
          if decorated:
              notes += '\n\n' + '\n'.join(decorated)
          command = ['gh', 'release', 'create', tag, *map(str, files), '--target', os.environ['GITHUB_SHA'], '--title', 'Literature Clock ' + version, '--notes', notes, '--latest']
          subprocess.run(command, check=True)
          PYTHON

  deploy-web:
    if: github.event_name == 'push'
    needs: [validate-versions, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the matching Netlify deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          token = os.environ['NETLIFY_AUTH_TOKEN']
          site_id = os.environ['NETLIFY_SITE_ID']
          commit = os.environ['GITHUB_SHA']
          base = f'https://api.netlify.com/api/v1/sites/{site_id}'
          headers = {'Authorization': f'Bearer {token}'}

          deploy = None
          for attempt in range(60):
              request = urllib.request.Request(f'{base}/deploys?per_page=100', headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  deploys = json.load(response)
              matches = [item for item in deploys
                         if item.get('commit_ref') == commit
                         and item.get('state') in {'ready', 'enqueued', 'building'}]
              ready = next((item for item in matches if item.get('state') == 'ready'), None)
              if ready:
                  deploy = ready
                  break
              time.sleep(10)

          if not deploy:
              raise SystemExit(f'No ready Netlify deploy found for commit {commit} after 10 minutes')

          request = urllib.request.Request(
              f"{base}/deploys/{deploy['id']}/restore",
              data=b'{}',
              headers={**headers, 'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(f"Published Netlify deploy {deploy['id']} for commit {commit} (HTTP {response.status})")
          PYTHON
