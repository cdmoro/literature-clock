name: Label merged PR impact

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged pull request number to label
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label-impact:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # pull_request_target runs the base repository's trusted revision.
        # Never check out or execute the pull request's head/merge commit here.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Classify changed paths and label the PR
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/label_pr_impacts.py
