name: macOS native screensaver

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing macos-native-vX.Y.Z release tag (empty = preview artifact only)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: macos-native-screensaver-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'macos-native-v')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Validate independent screensaver version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          tag = os.environ['RELEASE_TAG']
          if tag and not re.fullmatch(r'macos-native-v\d+\.\d+\.\d+', tag):
              raise SystemExit('Use a macos-native-vX.Y.Z release tag; web releases have separate versions.')
          PYTHON
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build universal native saver and package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          version="${RELEASE_TAG#macos-native-v}"
          python3 screensavers/macos-native/build.py --universal --version "${version:-0.1.0}"
      - uses: actions/upload-artifact@v4
        with:
          name: Literature-Clock-Native-macOS-universal
          path: |
            screensavers/macos-native/build/Literature-Clock-Native-macOS.zip
            screensavers/macos-native/build/Literature-Clock-Native-macOS.zip.sha256
          if-no-files-found: error
          retention-days: 30

  attach-to-release:
    if: github.event_name == 'release' || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Literature-Clock-Native-macOS-universal
          path: package
      - name: Attach downloads to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import subprocess
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          result = subprocess.run(['gh', 'release', 'view', tag, '--json', 'assets'],
                                  check=True, capture_output=True, text=True)
          existing = {asset['name'] for asset in json.loads(result.stdout)['assets']}
          files = sorted(Path('package').glob('*'))
          attached = [file for file in files if file.name in existing]
          if attached and len(attached) != len(files):
              raise SystemExit('Release has a partial ZIP/checksum pair; refusing to attach a newly built checksum to an older ZIP.')
          if not attached:
              subprocess.run(['gh', 'release', 'upload', tag, *[str(file) for file in files]], check=True)
          else:
              print('Downloads already attached; leaving existing assets unchanged.')
          PYTHON
