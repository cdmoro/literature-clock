name: macOS native screensaver

on:
  pull_request:
    branches: [main]
    paths:
      - 'screensavers/macos-native/**'
      - 'quotes/**'
      - 'src/strings/common/**'
      - 'src/strings/screensaver/**'
      - 'scripts/component_ownership.py'
      - '.github/workflows/macos-native-screensaver.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure the Metal compiler is available
        run: |
          if ! xcrun metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun metal --version
          fi
      - name: Build universal native saver and package
        run: python3 screensavers/macos-native/build.py --universal
      - name: Check installer transactions in an isolated directory
        run: '"screensavers/macos-native/build/Install Literature Clock.app/Contents/MacOS/Install Literature Clock" --check-install'
      - uses: actions/upload-artifact@v7
        with:
          path: screensavers/macos-native/build/Literature-Clock-Native-macOS.saver.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
