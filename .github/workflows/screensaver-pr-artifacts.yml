name: Publish native builds to pull requests

on:
  workflow_run:
    workflows:
      - macOS native screensaver
      - Windows native screensaver
      - macOS app
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  publish-links:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS saver archive
        if: github.event.workflow_run.name == 'macOS native screensaver' && github.event.workflow_run.conclusion == 'success'
        uses: actions/download-artifact@v8
        with:
          name: Literature-Clock-Native-macOS.saver.zip
          path: ${{ runner.temp }}/macos-native-saver
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          skip-decompress: true
      - name: Calculate macOS saver archive checksum
        id: macos-checksum
        if: github.event.workflow_run.name == 'macOS native screensaver' && github.event.workflow_run.conclusion == 'success'
        run: |
          digest=$(sha256sum "$RUNNER_TEMP/macos-native-saver/Literature-Clock-Native-macOS.saver.zip" | cut -d ' ' -f 1)
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        env:
          MACOS_SAVER_SHA256: ${{ steps.macos-checksum.outputs.sha256 }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const builds = {
              'macOS native screensaver': {
                heading: 'macOS screensaver build',
                marker: '<!-- literature-clock-screensaver-artifact:macos -->',
                days: 30,
                artifactName: 'Literature-Clock-Native-macOS.saver.zip',
                downloadLabel: 'Download universal macOS screensaver (.zip)',
                note: process.env.MACOS_SAVER_SHA256
                  ? `SHA-256: \`${process.env.MACOS_SAVER_SHA256}\`. Extract the .zip once to get the .saver bundle.`
                  : '',
              },
              'Windows native screensaver': {
                heading: 'Windows screensaver builds',
                marker: '<!-- literature-clock-screensaver-artifact:windows -->',
                days: 30,
                artifactPrefix: 'Literature-Clock-Native-Windows-',
              },
              'macOS app': {
                heading: 'macOS app build',
                marker: '<!-- literature-clock-macos-app-artifact -->',
                days: 14,
                artifactName: 'Literature-Clock-macOS-App',
                downloadLabel: 'Download universal macOS app (DMG and SHA-256)',
                note: 'Extract the artifact ZIP to get the DMG and its SHA-256 checksum file. The app includes the desktop widget.',
              },
            };
            const build = builds[run.name];
            let associatedPulls = run.pull_requests || [];
            if (associatedPulls.length === 0) {
              const response = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: run.head_sha,
              });
              associatedPulls = response.data;
            }
            if (associatedPulls.length === 0) {
              core.info('No pull request is associated with this native build.');
              return;
            }

            const pull = associatedPulls[0];
            const issue_number = pull.number;
            const currentPull = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            if (pull.head?.sha && currentPull.data.head.sha !== pull.head.sha) {
              core.info('Skipping an artifact link for an outdated pull request revision.');
              return;
            }

            const { data } = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: run.id });
            const artifacts = data.artifacts.filter(item => !item.expired && (build.artifactName
              ? item.name === build.artifactName
              : item.name.startsWith(build.artifactPrefix)))
              .sort((a, b) => a.name.localeCompare(b.name));
            const links = artifacts.map(item => {
              const label = build.downloadLabel ?? `Download Windows screensaver (${item.name.slice(build.artifactPrefix.length)})`;
              const url = `https://github.com/${owner}/${repo}/actions/runs/${run.id}/artifacts/${item.id}`;
              return `- [${label}](${url})`;
            });
            const note = links.length && build.note ? `${build.note}\n\n` : '';
            const status = run.conclusion === 'success' && links.length
              ? `Download links expire after ${build.days} days. [View the workflow run](${run.html_url}).`
              : `The workflow completed with status **${run.conclusion}**. See [the workflow run](${run.html_url}) for details.`;
            const body = `${build.marker}\n## ${build.heading}\n\n${links.length ? links.join('\n') : 'No downloadable artifact is available for this run.'}\n\n${note}${status}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(build.marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
