<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script>
      // Apply the saved appearance before styles load to avoid a light flash.
      try {
        const saved = localStorage.getItem('literature-clock-admin-appearance');
        document.documentElement.dataset.theme =
          saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'dark'
            : 'light';
      } catch {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
    </script>
    <title>Translation studio · Literature Clock</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
